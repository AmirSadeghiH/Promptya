{% extends "web/base.html" %}
{% load static %}
{% block title %}{{ i18n.share_a_prompt }} · Promptya{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}

{% block content %}
<h1 class="page-title" data-i18n="share_a_prompt">{{ i18n.share_a_prompt }}</h1>

<form class="create-form" id="create-form" enctype="multipart/form-data" novalidate>
  <label class="field">
    <span data-i18n="title">{{ i18n.title }}</span>
    <input type="text" name="title" maxlength="200" required placeholder="{{ i18n.title_placeholder }}">
  </label>

  <label class="field">
    <span data-i18n="type">{{ i18n.type }}</span>
    <select name="post_type" id="id_post_type">
      <option value="prompt" data-i18n="prompt_type">{{ i18n.prompt_type }}</option>
      <option value="image" data-i18n="image">{{ i18n.image }}</option>
      <option value="video" data-i18n="video">{{ i18n.video }}</option>
      <option value="audio" data-i18n="audio">{{ i18n.audio }}</option>
    </select>
  </label>

  <label class="field">
    <span data-i18n="category">{{ i18n.category }}</span>
    <select name="category_id" required>
      <option value="" disabled selected data-i18n="choose_category">{{ i18n.choose_category }}</option>
      {% for category in category_options %}
        <option value="{{ category.id }}">{{ category.name }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="field">
    <span data-i18n="ai_model">{{ i18n.ai_model }} <small data-i18n="optional">{{ i18n.optional }}</small></span>
    <input type="text" name="ai_model" maxlength="100" placeholder="{{ i18n.ai_model_placeholder }}">
  </label>

  <!-- Text content preview: the prompt itself is the media for a text post,
       so it renders inside the same frame style used for image/video/audio. -->
  <div class="field" id="prompt-preview-field" hidden>
    <div class="upload-preview">
      <div class="up-preview-frame">
        <p class="up-preview-text" id="prompt-preview-text" dir="auto"></p>
      </div>
    </div>
  </div>

  <label class="field" id="prompt-field">
    <span data-i18n="the_prompt">{{ i18n.the_prompt }}</span>
    <textarea name="prompt" id="id_prompt" rows="6" placeholder="{{ i18n.prompt_placeholder }}"></textarea>
  </label>

  <label class="field">
    <span data-i18n="description">{{ i18n.description }} <small data-i18n="optional">{{ i18n.optional }}</small></span>
    <textarea name="description" rows="3" placeholder="{{ i18n.description_placeholder }}"></textarea>
  </label>

  <!-- Dynamic media field: exactly one zone, swapped by post type -->
  <div class="field" id="media-upload-fields">
    <span data-i18n="media_label">{{ i18n.media_label }}</span>
    <div id="image-field" data-upload='{"kind":"image","label":"{{ i18n.upload_image|escapejs }}"}' hidden>
      <input type="file" name="image" accept="image/jpeg,image/png,image/webp,image/gif">
    </div>
    <div id="video-field" data-upload='{"kind":"video","label":"{{ i18n.upload_video|escapejs }}"}' hidden>
      <input type="file" name="video" accept="video/mp4,video/webm,video/quicktime">
    </div>
    <div id="audio-field" data-upload='{"kind":"audio","label":"{{ i18n.upload_audio|escapejs }}"}' hidden>
      <input type="file" name="audio" accept="audio/mpeg,audio/wav,audio/ogg,audio/mp4">
    </div>
  </div>

  <div class="form-error" id="create-error" hidden></div>

  <button class="btn btn-primary btn-lg" type="submit" data-i18n="publish">{{ i18n.publish }}</button>
</form>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/upload.js' %}" defer></script>
<script src="{% static 'js/player.js' %}" defer></script>
<script src="{% static 'js/create-form.js' %}" defer></script>
{% endblock %}
